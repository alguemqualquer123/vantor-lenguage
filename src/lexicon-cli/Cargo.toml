[package]
name = "lexicon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "lex"
path = "src/main.rs"

[dependencies]
lexicon-core = { path = "../lexicon-core" }
lexicon-lexer = { path = "../lexicon-lexer" }
lexicon-parser = { path = "../lexicon-parser" }
lexicon-analysis = { path = "../lexicon-analysis" }
lexicon-codegen = { path = "../lexicon-codegen" }
lexicon-utils = { path = "../lexicon-utils" }
lexicon-http = { path = "../lexicon-http" }
clap.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
indicatif.workspace = true
notify = "6.1"
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.11", features = ["json", "blocking"] }
regex = "1.10"
# `wgpu` feature: renderer Vulkan / DirectX 12 / OpenGL (metal no macOS) —
# o mesmo motor gráfico do Firefox. Backend selecionado em runtime pelo
# `gfx.rs` (`Renderer::Wgpu`); `glow` fica como fallback.
eframe = { version = "0.31", optional = true, features = ["wgpu"] }
# Mesma 0.30.x do eframe (unificada pelo cargo): só para ligar
# `with_any_thread` no hook do event loop (janelas fora da main thread).
winit = { version = "0.30", optional = true }
egui_extras = { version = "0.31", optional = true }
once_cell = "1.19"
# webview dep REMOVED 2026-09-29: the `webview` crate is referenced by NO
# Rust code (webview.rs is unlinked dead code; compiler paths are stubs)
# and its C library cannot link on MinGW-GNU (undefined CLSID_/IID_
# symbols), which broke EVERY `cargo build`/`cargo test` of the binary.
# Restore on MSVC-only toolchains if native WebView returns.
# webview = { version = "0.1", package = "webview" }

# `gui` (default) liga o IDE grafico (eframe). Build minimo do SDK:
# `cargo build --profile dist --no-default-features -p lexicon-cli`.
[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:winit"]
