[workspace]
members = [
    "src/lexicon-cli",
    "src/lexicon-core",
    "src/lexicon-lexer",
    "src/lexicon-parser",
    "src/lexicon-analysis",
    "src/lexicon-codegen",
    "src/lexicon-utils",
    "src/lexicon-async",
    "src/lexicon-http",
    "src/lexicon-cache",
    "src/lexicon-gui",
    "src/lexicon-wasm",
    "src/lexicon-db",
]
resolver = "2"

[workspace.package]
version = "0.3.5"
edition = "2021"
license = "MIT"
authors = ["lexiconLang Team"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
indicatif = "0.17"
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower = "0.4"
once_cell = "1.19"
parking_lot = "0.12"
wasm-bindgen = "0.2"
dashmap = "5.5"
lru = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Distribuicao (SDK): binario minimo. `cargo build --profile dist -p lexicon-cli`.
# Troca ~10% de throughput por ~30-40% menos bytes vs `release`.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"

[profile.bench]
inherits = "release"
